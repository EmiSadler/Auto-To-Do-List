<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="panel.css">
    </head>
    <body>
        <div id="app">
            <h1>Active To-Dos</h1>
            <div id="reconnect-banner" style="display: none;">
                <p>Your Google Calendar connection has expired.</p>
                <button id="reconnect-button">Reconnect Google Calendar</button>
            </div>
            <button id="clear-completed-button">Clear completed</button>
            <button id="new-checklist-button">+ New Checklist</button>
            <button id="theme-toggle-button">🌙</button>
            <div id="new-checklist-form" style="display: none;">
                <button id="new-checklist-cancel" type="button">x</button>
                <input type="text" id="new-checklist-title" placeholder="Checklist title...">
                <input type="text" id="new-checklist-item" placeholder="First to-do...">
                <button id="new-checklist-submit">Create</button>
            </div>
            <div id="todo-list"></div>
            </div>
        <script src="panel.js"></script>
    </body>
</html>
